# One Deployment controlled by the main scale-to-zero instance (/staging)
keda:
  enabled: true
  authenticationRefName: keda-aws-trigger-auth
  pollingInterval: 30
  cooldownPeriod: 10
  minReplicaCount: 0
  maxReplicaCount: 2
  advanced:
    scaleDownStabilization: 180

  dynamodb:
    region: us-east-1
    tableName: staging-keda-scale-to-zero-sessions
    indexName: gsi_due
    expressionAttributeNames: '{ "#k": "gsi_pk" }'
    keyConditionExpression: "#k = :v"
    expressionAttributeValues: '{ ":v": {"S":"PING"} }'
    targetValue: "1"
    activationTargetValue: "0"

  targets:
    - name: mailpit
      kind: Deployment
      replicas: 1
      minReplicaCount: 0
      maxReplicaCount: 1
